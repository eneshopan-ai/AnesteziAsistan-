<script>
/* Sürüm denetimi: ana ekrana eklenen uygulama eski dosyaları önbellekten gösterebilir.
   version.json ile yüklü sürüm farklıysa sayfa bir kez yeni adresle yenilenir. */
(function () {
  var build = window.AA_BUILD;
  if (!build || !window.fetch) return;
  var KEY = 'aa.updateTried';
  function check() {
    try {
      fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (v) {
          if (!v || !v.build || v.build === build) return;
          var tried = null;
          try { tried = sessionStorage.getItem(KEY); } catch (e) { /* yok say */ }
          if (tried === v.build) return;
          try { sessionStorage.setItem(KEY, v.build); } catch (e) { /* yok say */ }
          location.replace(location.pathname + '?b=' + encodeURIComponent(v.build) + location.hash);
        })
        .catch(function () { /* çevrimdışı: yok say */ });
    } catch (e) { /* yok say */ }
  }
  check();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') check();
  });
})();
</script>

<style>
/* Klinik monitör estetiği: koyu zemin, ince ölçüm ızgarası, deniz mavisi vurgu.
   Renkler iOS sürümündeki Theme.swift ile birebir aynıdır (açık / koyu). */
:root {
  --bg: #F2F6F8; --bg-deep: #E3EBEF; --surface: #FFFFFF; --surface-elev: #FFFFFF;
  --accent: #0C8681; --accentSoft: #0A6F6B; --secondary: #4A57C9; --tertiary: #7434D4;
  --text: #0A1A21; --textSecondary: #44606B; --textTertiary: #6C848F;
  --success: #0E8A5A; --info: #0A6CCB; --warning: #A96A00; --danger: #CB2A3C;
  --blue: #1F6FEB; --pink: #C2255C; --cyan: #0891B2; --indigo: #4F46E5;
  --hairline: rgba(10,26,33,.10); --hairline-strong: rgba(10,26,33,.20);
  --fill-faint: rgba(10,26,33,.030); --fill-subtle: rgba(10,26,33,.045);
  --fill-medium: rgba(10,26,33,.065); --fill-strong: rgba(10,26,33,.090);
  --card: rgba(255,255,255,.94); --on-accent: #FFFFFF; --shadow: rgba(34,50,58,.12);
  --code-bg: #EBF1F3; --grid-line: rgba(10,26,33,.0275); --glow: .42;
  --grad-accent: linear-gradient(135deg, #14A29C, #0A6F6B);
  --grad-anes: linear-gradient(135deg, #179C95, #0B5E70);
  --grad-icu: linear-gradient(135deg, #6572E8, #3E3390);
  --bar-bg: rgba(242,246,248,.78);
  --font: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Nunito", system-ui, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --r-s: 12px; --r-m: 18px; --r-l: 26px; --r-xl: 34px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #050D12; --bg-deep: #020609; --surface: #0E1A21; --surface-elev: #142530;
    --accent: #34D8D0; --accentSoft: #1E9E9A; --secondary: #7C8CFF; --tertiary: #B388FF;
    --text: #EAF6F8; --textSecondary: #9FB3BC; --textTertiary: #6B818C;
    --success: #3ED598; --info: #4FA8FF; --warning: #FFB020; --danger: #FF5C6C;
    --blue: #5AA9FF; --pink: #FF6B9D; --cyan: #22D3EE; --indigo: #818CF8;
    --hairline: rgba(255,255,255,.10); --hairline-strong: rgba(255,255,255,.18);
    --fill-faint: rgba(255,255,255,.030); --fill-subtle: rgba(255,255,255,.050);
    --fill-medium: rgba(255,255,255,.070); --fill-strong: rgba(255,255,255,.085);
    --card: rgba(14,26,33,.75); --on-accent: #05121A; --shadow: rgba(0,0,0,.35);
    --code-bg: rgba(0,0,0,.25); --grid-line: rgba(255,255,255,.05); --glow: 1;
    --grad-accent: linear-gradient(135deg, #4DF0E4, #1E9E9A);
    --grad-anes: linear-gradient(135deg, #1FB6AE, #0E6F84);
    --grad-icu: linear-gradient(135deg, #7C8CFF, #4A3D9E);
    --bar-bg: rgba(5,13,18,.72);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #050D12; --bg-deep: #020609; --surface: #0E1A21; --surface-elev: #142530;
  --accent: #34D8D0; --accentSoft: #1E9E9A; --secondary: #7C8CFF; --tertiary: #B388FF;
  --text: #EAF6F8; --textSecondary: #9FB3BC; --textTertiary: #6B818C;
  --success: #3ED598; --info: #4FA8FF; --warning: #FFB020; --danger: #FF5C6C;
  --blue: #5AA9FF; --pink: #FF6B9D; --cyan: #22D3EE; --indigo: #818CF8;
  --hairline: rgba(255,255,255,.10); --hairline-strong: rgba(255,255,255,.18);
  --fill-faint: rgba(255,255,255,.030); --fill-subtle: rgba(255,255,255,.050);
  --fill-medium: rgba(255,255,255,.070); --fill-strong: rgba(255,255,255,.085);
  --card: rgba(14,26,33,.75); --on-accent: #05121A; --shadow: rgba(0,0,0,.35);
  --code-bg: rgba(0,0,0,.25); --grid-line: rgba(255,255,255,.05); --glow: 1;
  --grad-accent: linear-gradient(135deg, #4DF0E4, #1E9E9A);
  --grad-anes: linear-gradient(135deg, #1FB6AE, #0E6F84);
  --grad-icu: linear-gradient(135deg, #7C8CFF, #4A3D9E);
  --bar-bg: rgba(5,13,18,.72);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; min-height: 100%;
  overflow-x: hidden;
}
/* Aurora zemin + ince ölçüm ızgarası (sabit katmanlar) */
.backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(420px 420px at 15% 8%, color-mix(in srgb, var(--t, var(--accent)) calc(28% * var(--glow)), transparent), transparent 70%),
    radial-gradient(380px 380px at 95% 30%, color-mix(in srgb, var(--secondary) calc(20% * var(--glow)), transparent), transparent 70%),
    radial-gradient(460px 460px at 50% 98%, color-mix(in srgb, var(--accentSoft) calc(14% * var(--glow)), transparent), transparent 70%),
    linear-gradient(180deg, var(--bg), var(--bg-deep));
  transition: background .4s ease; }
.backdrop::after { content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(to right, var(--grid-line) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
  background-size: 26px 26px; }

#app { position: relative; z-index: 1; padding-inline: 16px; padding-block: 0 48px; }
.page { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.page.wide { max-width: 1120px; }
.page > [data-region]:empty { display: none; }
.page > [data-region] { display: flex; flex-direction: column; gap: 22px; min-width: 0; }

/* Üst çubuk */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; margin-inline: -16px; padding: 10px 16px;
  display: flex; align-items: center; gap: 8px;
  background: var(--bar-bg); -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
  border-bottom: 1px solid transparent; transition: border-color .2s; }
.topbar.scrolled { border-bottom-color: var(--hairline); }
.topbar .title { flex: 1; font-family: var(--font); font-weight: 700; font-size: 17px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.topbar .left, .topbar .right { flex: 0 0 auto; min-width: 88px; display: flex; gap: 8px; align-items: center; }
.topbar .right { justify-content: flex-end; }
.circle-btn { width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; flex: 0 0 auto;
  background: var(--fill-medium); border: 1px solid var(--hairline); color: var(--textSecondary); cursor: pointer; position: relative;
  transition: transform .12s ease, background .2s; }
.circle-btn:hover { background: var(--fill-strong); }
.circle-btn:active { transform: scale(.94); }
.circle-btn.tinted { color: var(--t); }
.circle-btn .dot { position: absolute; top: 1px; right: 1px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); border: 1.5px solid var(--bg); }

button { font: inherit; color: inherit; }
button, [role="button"] { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: 0 0 auto; }

/* Kart ve bölüm başlıkları */
.card { position: relative; padding: 16px; border-radius: var(--r-l); background: var(--card);
  border: 1px solid var(--hairline); box-shadow: 0 10px 36px var(--shadow);
  -webkit-backdrop-filter: blur(20px) saturate(1.2); backdrop-filter: blur(20px) saturate(1.2);
  display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card.pad-l { padding: 22px; }
.card.tinted { border-color: color-mix(in srgb, var(--t) 25%, transparent); }
.sec-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sec-ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: 0 0 auto;
  background: color-mix(in srgb, var(--t) 16%, transparent); color: var(--t); font-size: 15px; }
.sec-text { flex: 1; min-width: 0; }
.sec-title { font-family: var(--font); font-weight: 700; font-size: 15px; color: var(--text); line-height: 1.25; }
.sec-sub { font-size: 11.5px; color: var(--textTertiary); line-height: 1.3; }

.badge { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font); font-size: 10px; font-weight: 800;
  letter-spacing: .04em; padding: 4px 8px; border-radius: 999px; white-space: nowrap;
  background: color-mix(in srgb, var(--t, var(--accent)) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--t, var(--accent)) 35%, transparent); color: var(--t, var(--accent)); }
.badge.upper { text-transform: uppercase; }
.badge.filled { background: color-mix(in srgb, var(--t) 92%, transparent); border-color: transparent; color: var(--on-accent); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }

.num { font-family: var(--font); font-variant-numeric: tabular-nums; }

.metrics { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.metrics.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.metric { padding: 11px 12px; border-radius: var(--r-m); background: var(--fill-subtle); border: 1px solid var(--hairline); min-width: 0; }
.metric.emph { border-color: color-mix(in srgb, var(--t) 35%, transparent); }
.metric .m-title { display: flex; align-items: flex-start; gap: 5px; font-family: var(--font); font-size: 11px; font-weight: 600; color: var(--textTertiary); line-height: 1.25; }
.metric .m-title .icon { margin-top: 1px; }
.metrics.three .metric.emph .m-val b { font-size: 22px; }
.metric .m-title .icon { color: var(--t); font-size: 11px; }
.metric .m-val { display: flex; align-items: baseline; gap: 3px; margin-top: 6px; min-width: 0; }
.metric .m-val b { font-family: var(--font); font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metric.emph .m-val b { font-size: 26px; color: var(--t); }
.metric .m-val span { font-family: var(--font); font-size: 11px; font-weight: 700; color: var(--textSecondary); white-space: nowrap; }

.inforow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 5px 0; }
.inforow .l { font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--textSecondary); }
.inforow .l small { display: block; font-family: var(--font-body); font-size: 10.5px; font-weight: 400; color: var(--textTertiary); }
.inforow .v { font-family: var(--font); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 700; color: var(--vt, var(--text)); text-align: right; }
.divider { height: 1px; background: var(--hairline); border: 0; margin: 0; }

.panel { padding: 12px; border-radius: var(--r-m); background: var(--fill-subtle); display: flex; flex-direction: column; gap: 8px; }
.panel.faint { background: var(--fill-faint); }

.big-result { text-align: center; padding: 18px 12px; border-radius: var(--r-l);
  background: color-mix(in srgb, var(--t) 10%, transparent); border: 1px solid color-mix(in srgb, var(--t) 30%, transparent); }
.big-result .lbl { font-family: var(--font); font-size: 10px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; color: var(--textTertiary); }
.big-result .val { display: flex; justify-content: center; align-items: baseline; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.big-result .val b { font-family: var(--font); font-variant-numeric: tabular-nums; font-weight: 900; font-size: clamp(34px, 11vw, 48px); line-height: 1.05; color: var(--text); }
.big-result .val span { font-family: var(--font); font-weight: 800; font-size: 15px; color: var(--t); }
.big-result .cap { font-size: 11.5px; color: var(--textSecondary); margin-top: 4px; }

/* Girdi alanları */
.fields { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.fields.one { grid-template-columns: minmax(0, 1fr); }
.nf { padding: 12px 14px; border-radius: var(--r-m); background: var(--fill-subtle); border: 1px solid var(--hairline);
  display: flex; flex-direction: column; gap: 8px; min-width: 0; transition: border-color .18s, background .18s; }
.nf:focus-within { background: var(--fill-strong); border-color: color-mix(in srgb, var(--t, var(--accent)) 65%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--t, var(--accent)) 30%, transparent); }
.nf .nf-label { display: flex; align-items: center; gap: 5px; font-family: var(--font); font-size: 11.5px; font-weight: 600; color: var(--textTertiary); }
.nf .nf-label .icon { color: var(--t, var(--accent)); font-size: 11px; }
.nf .nf-label .hint { margin-left: auto; font-weight: 500; font-size: 10.5px; }
.nf .nf-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.nf input { flex: 1; min-width: 0; width: 100%; border: 0; outline: 0; background: transparent; color: var(--text);
  font-family: var(--font); font-variant-numeric: tabular-nums; font-weight: 800; font-size: 24px; padding: 0; }
.nf input::placeholder { color: var(--textTertiary); font-weight: 600; font-size: 16px; }
.nf .unit { font-family: var(--font); font-size: 12px; font-weight: 700; color: var(--textSecondary); white-space: nowrap; }
.nf .steps { display: flex; gap: 4px; }
.step-btn { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--fill-medium); color: var(--textSecondary);
  display: grid; place-items: center; cursor: pointer; font-size: 12px; flex: 0 0 auto; }
.step-btn:active { transform: scale(.9); }
.nf.compact input { font-size: 20px; }

.text-input { width: 100%; padding: 12px 14px; border-radius: var(--r-m); background: var(--fill-subtle); border: 1px solid var(--hairline);
  color: var(--text); font-family: var(--font); font-size: 16px; font-weight: 600; outline: 0; }
.text-input:focus { border-color: color-mix(in srgb, var(--accent) 65%, transparent); background: var(--fill-strong); }
.search { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: var(--r-m); background: var(--fill-subtle); border: 1px solid var(--hairline); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-family: var(--font); font-size: 15px; }
.search .icon { color: var(--textTertiary); }

/* Çipler ve segmentler */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px; margin: -2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px; padding: 9px 14px; border-radius: 999px;
  font-family: var(--font); font-size: 13px; font-weight: 700; color: var(--textSecondary); cursor: pointer;
  background: var(--fill-subtle); border: 1px solid var(--hairline); transition: background .2s, border-color .2s, color .2s; }
.chip small { font-size: 11px; font-weight: 600; opacity: .75; }
.chip.on { color: var(--t, var(--accent)); background: color-mix(in srgb, var(--t, var(--accent)) 18%, transparent); border-color: color-mix(in srgb, var(--t, var(--accent)) 80%, transparent); }
.chip:active { transform: scale(.97); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 2px; border-radius: 10px; background: var(--fill-medium); }
.seg button { border: 0; background: transparent; padding: 7px 6px; border-radius: 8px; font-family: var(--font); font-size: 12.5px; font-weight: 700;
  color: var(--textSecondary); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button.on { background: var(--surface-elev); color: var(--text); box-shadow: 0 1px 4px var(--shadow); }

.preset { flex: 0 0 auto; text-align: left; padding: 9px 12px; border-radius: var(--r-s); background: var(--fill-subtle); border: 1px solid var(--hairline); cursor: pointer; }
.preset b { display: block; font-family: var(--font); font-size: 14px; color: var(--text); }
.preset span { font-size: 10.5px; color: var(--textTertiary); white-space: nowrap; }
.preset.on { background: color-mix(in srgb, var(--t, var(--info)) 15%, transparent); border-color: color-mix(in srgb, var(--t, var(--info)) 70%, transparent); }
.preset.on b { color: var(--t, var(--info)); }

/* Doz kaydırıcısı */
.slider { display: flex; flex-direction: column; gap: 10px; }
.slider .s-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.slider .s-head .l { font-family: var(--font); font-size: 12px; font-weight: 600; color: var(--textTertiary); }
.slider .s-head .v b { font-family: var(--font); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 800; color: var(--t); }
.slider .s-head .v span { font-family: var(--font); font-size: 11px; font-weight: 700; color: var(--textSecondary); margin-left: 3px; }
.slider.outside .s-head .v b { color: var(--warning); }
.slider .track-wrap { position: relative; height: 28px; }
.slider .band { position: absolute; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px; background: color-mix(in srgb, var(--t) 30%, transparent); pointer-events: none; }
.slider input[type=range] { -webkit-appearance: none; appearance: none; position: absolute; inset: 0; width: 100%; height: 28px; margin: 0; background: transparent; cursor: pointer; }
.slider input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--st) 0 var(--p, 50%), var(--fill-medium) var(--p, 50%) 100%); }
.slider input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--fill-medium); }
.slider input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--st); }
.slider input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3), 0 0 0 1px rgba(0,0,0,.06); }
.slider input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.slider .ends { display: flex; justify-content: space-between; font-family: var(--font); font-size: 10px; color: var(--textTertiary); margin-top: -6px; }
.slider .note { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--textTertiary); }
.slider .note .icon { color: var(--success); }
.slider.outside .note, .slider.outside .note .icon { color: var(--warning); }

.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.quick button { border: 1px solid var(--hairline); background: var(--fill-subtle); border-radius: var(--r-s); padding: 9px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.quick button small { font-family: var(--font); font-size: 10.5px; font-weight: 700; color: var(--textTertiary); }
.quick button b { font-family: var(--font); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 800; }

/* Anahtar (toggle) */
.switch { position: relative; width: 51px; height: 31px; flex: 0 0 auto; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--fill-strong); transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + span { background: var(--t, var(--accent)); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.check-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--r-m); background: var(--fill-subtle); border: 1px solid var(--hairline); cursor: pointer; text-align: left; width: 100%; }
.check-row.on { background: color-mix(in srgb, var(--t) 12%, transparent); border-color: color-mix(in srgb, var(--t) 55%, transparent); }
.check-row .box { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--hairline-strong); display: grid; place-items: center; flex: 0 0 auto; color: var(--on-accent); font-size: 14px; }
.check-row.on .box { background: var(--t); border-color: var(--t); }
.check-row .ct { flex: 1; min-width: 0; }
.check-row .ct b { display: block; font-family: var(--font); font-size: 13.5px; font-weight: 700; color: var(--text); }
.check-row .ct span { display: block; font-size: 11.5px; color: var(--textTertiary); }
.check-row .pts { font-family: var(--font); font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 800; color: var(--textTertiary); white-space: nowrap; }
.check-row.on .pts { color: var(--t); }

.opt-list { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-s); background: var(--fill-faint); border: 1px solid var(--hairline); cursor: pointer; text-align: left; width: 100%; }
.opt .radio { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--hairline-strong); flex: 0 0 auto; position: relative; }
.opt.on { background: color-mix(in srgb, var(--t) 12%, transparent); border-color: color-mix(in srgb, var(--t) 60%, transparent); }
.opt.on .radio { border-color: var(--t); }
.opt.on .radio::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--t); }
.opt .ot { flex: 1; min-width: 0; font-size: 13px; color: var(--text); }
.opt .pts { font-family: var(--font); font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 800; color: var(--textTertiary); white-space: nowrap; }
.opt.on .pts { color: var(--t); }

/* Uyarılar */
.warn { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: var(--r-m); cursor: pointer; text-align: left; width: 100%;
  background: color-mix(in srgb, var(--t) 8%, transparent); border: 1px solid color-mix(in srgb, var(--t) 28%, transparent); }
.warn > .icon { color: var(--t); font-size: 15px; margin-top: 1px; }
.warn .wt { flex: 1; min-width: 0; }
.warn .wt b { display: flex; justify-content: space-between; gap: 6px; font-family: var(--font); font-size: 13px; font-weight: 700; color: var(--text); }
.warn .wt b .icon { color: var(--textTertiary); font-size: 10px; margin-top: 4px; transition: transform .2s; }
.warn .wt p { margin: 4px 0 0; font-size: 12px; color: var(--textSecondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.warn.open .wt p { display: block; -webkit-line-clamp: unset; }
.warn.open .wt b .icon { transform: rotate(180deg); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 16px; border-radius: var(--r-m); cursor: pointer;
  font-family: var(--font); font-size: 15px; font-weight: 800; width: 100%;
  background: color-mix(in srgb, var(--t, var(--accent)) 18%, transparent); color: var(--t, var(--accent));
  border: 1.2px solid color-mix(in srgb, var(--t, var(--accent)) 60%, transparent); }
.btn:active { transform: scale(.985); }
.btn.ok { --t: var(--success); }
.btn.small { width: auto; padding: 8px 12px; font-size: 13px; border-radius: 999px; }
.btn.ghost { background: transparent; border-color: var(--hairline); color: var(--textSecondary); }
.btn.danger { --t: var(--danger); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.link-row { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-radius: var(--r-s); cursor: pointer; border: 0; width: 100%; text-align: left;
  background: color-mix(in srgb, var(--t) 10%, transparent); color: var(--t); font-family: var(--font); font-size: 12px; font-weight: 700; }
.link-row .grow { flex: 1; }
.pill-btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 999px; border: 0; cursor: pointer;
  background: color-mix(in srgb, var(--t) 12%, transparent); color: var(--t); font-family: var(--font); font-size: 11px; font-weight: 700; white-space: nowrap; }
.text-btn { border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; padding: 4px 2px;
  font-family: var(--font); font-size: 12px; font-weight: 700; color: var(--t, var(--accent)); }

.bullets { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.bullets li { display: flex; gap: 8px; font-size: 12px; color: var(--textTertiary); }
.bullets li::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: color-mix(in srgb, var(--t, var(--accent)) 60%, transparent); flex: 0 0 auto; margin-top: 7px; }
.bullets.strong li { color: var(--textSecondary); font-size: 12.5px; }

.empty { align-items: center; text-align: center; padding: 28px 22px; }
.empty .e-ico { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; font-size: 26px;
  background: color-mix(in srgb, var(--t) 12%, transparent); color: var(--t); }
.empty h3 { margin: 0; font-family: var(--font); font-size: 16px; }
.empty p { margin: 0; font-size: 12.5px; color: var(--textSecondary); max-width: 46ch; }

.footnote { display: flex; gap: 8px; align-items: flex-start; font-size: 11px; color: var(--textTertiary); padding: 0 4px; }
.footnote .icon { margin-top: 2px; }

/* Formül şeridi */
.formula { padding: 12px; border-radius: var(--r-m); background: var(--code-bg); border: 1px solid var(--hairline); }
.formula .f-l { font-family: var(--font); font-size: 9.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--textTertiary); }
.formula code { display: block; font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--textSecondary); margin-top: 6px; word-break: break-word; }
.formula code.sub { font-weight: 600; color: var(--t); }

/* Tablolar */
.tbl { width: 100%; border-collapse: collapse; font-family: var(--font); font-variant-numeric: tabular-nums; }
.tbl th { font-size: 10px; font-weight: 800; color: var(--textTertiary); text-align: right; padding: 0 10px 6px; letter-spacing: .02em; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl td { padding: 9px 10px; text-align: right; font-size: 13.5px; font-weight: 600; color: var(--textSecondary); border-bottom: .5px solid var(--hairline); }
.tbl td.strong { color: var(--text); font-weight: 700; font-size: 15px; }
.tbl tr.cur td { color: var(--t); background: color-mix(in srgb, var(--t) 12%, transparent); font-weight: 800; }
.tbl tr.cur td:first-child { border-radius: 10px 0 0 10px; }
.tbl tr.cur td:last-child { border-radius: 0 10px 10px 0; }
.tbl .mini-warn { color: var(--warning); font-size: 10px; margin-left: 4px; }
.tbl-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }

/* Gösterge (RateGauge) */
.gauge { position: relative; width: 236px; height: 236px; margin: 4px auto; }
.gauge svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.gauge .g-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 28px; }
.gauge .g-l { font-family: var(--font); font-size: 9.5px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; color: var(--textTertiary); }
.gauge .g-v { display: flex; align-items: baseline; gap: 4px; }
.gauge .g-v b { font-family: var(--font); font-variant-numeric: tabular-nums; font-size: 52px; font-weight: 900; line-height: 1.05; }
.gauge .g-v span { font-family: var(--font); font-size: 15px; font-weight: 800; color: var(--gt); }
.gauge .g-s { font-family: var(--font); font-variant-numeric: tabular-nums; font-size: 12.5px; font-weight: 600; color: var(--textSecondary); }
.gauge .g-c { font-size: 10px; color: var(--textTertiary); margin-top: 2px; }

/* Alt sabit özet */
.sticky-sum { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: var(--bar-bg); -webkit-backdrop-filter: blur(20px) saturate(1.3); backdrop-filter: blur(20px) saturate(1.3); border-top: 1px solid var(--hairline); }
.sticky-sum .in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.sticky-sum .k { font-family: var(--font); font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--textTertiary); }
.sticky-sum .vv b { font-family: var(--font); font-variant-numeric: tabular-nums; font-size: 24px; font-weight: 900; }
.sticky-sum .vv span { font-family: var(--font); font-size: 12px; font-weight: 800; color: var(--t); margin-left: 3px; }
.sticky-sum .sep { width: 1px; height: 30px; background: var(--hairline); }
.sticky-sum .d { min-width: 0; font-size: 11px; color: var(--textSecondary); }
.sticky-sum .d small { display: block; font-size: 10.5px; color: var(--textTertiary); }
body.has-sticky #app { padding-bottom: 110px; }

/* Ana sayfa */
.home-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 18px; }
.home-head .date { font-family: var(--font); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--textTertiary); }
.home-head h1 { margin: 2px 0 0; font-family: var(--font); font-size: 28px; font-weight: 900; letter-spacing: -.01em; line-height: 1.1; text-wrap: balance; }
.eyebrow { font-family: var(--font); font-size: 12px; font-weight: 800; letter-spacing: .1em; color: var(--textTertiary); padding-left: 4px; text-transform: uppercase; }
.modules { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 840px) { .modules { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.module { overflow: hidden; cursor: pointer; text-align: left; border-color: color-mix(in srgb, var(--t) 22%, transparent); padding: 22px; transition: transform .15s ease; }
.module:active { transform: scale(.985); }
.module::after { content: ""; position: absolute; top: -50px; right: -40px; width: 150px; height: 150px; border-radius: 50%;
  background: color-mix(in srgb, var(--t) 12%, transparent); filter: blur(45px); pointer-events: none; }
.module .m-top { display: flex; justify-content: space-between; align-items: flex-start; }
.module .m-ico { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: #fff; font-size: 24px;
  box-shadow: 0 6px 18px color-mix(in srgb, var(--t) 45%, transparent); }
.module h2 { margin: 0; font-family: var(--font); font-size: 22px; font-weight: 800; }
.module p { margin: 4px 0 0; font-size: 12.5px; color: var(--textSecondary); }
.module .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.module .tags span { font-family: var(--font); font-size: 10px; font-weight: 600; padding: 5px 8px; border-radius: 999px; background: var(--fill-medium); color: var(--textTertiary); }
.module .open { align-self: flex-end; display: inline-flex; align-items: center; gap: 5px; font-family: var(--font); font-size: 13px; font-weight: 800; color: var(--t); }

/* Katalog */
.hero h1 { margin: 0; font-family: var(--font); font-size: 26px; font-weight: 900; }
.hero p { margin: 4px 0 0; font-size: 12.5px; color: var(--textSecondary); }
.hero .h-top { display: flex; justify-content: space-between; gap: 12px; }
.hero .h-ico { font-size: 30px; color: var(--t); }
.hero .noPatient { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--warning); }
.cat-grid { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 700px) { .cat-grid { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); } }
.cat-group { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--r-m); cursor: pointer; text-align: left; width: 100%;
  background: var(--fill-subtle); border: 1px solid color-mix(in srgb, var(--t) 25%, transparent); transition: background .15s; min-width: 0; }
.row:hover { background: var(--fill-medium); }
.row:active { transform: scale(.99); }
.row .r-ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: 0 0 auto;
  background: color-mix(in srgb, var(--t) 18%, transparent); color: var(--t); font-size: 18px; }
.row .r-t { flex: 1; min-width: 0; }
.row .r-t b { display: block; font-family: var(--font); font-size: 14.5px; font-weight: 700; color: var(--text); }
.row .r-t span { display: block; font-size: 11.5px; color: var(--textTertiary); }
.row > .icon { color: var(--textTertiary); font-size: 13px; }
.row.planned { cursor: default; background: var(--fill-faint); border-color: var(--hairline); }
.row.planned .r-ico { background: color-mix(in srgb, var(--t) 7%, transparent); color: color-mix(in srgb, var(--t) 45%, transparent); }
.row.planned .r-t b { color: var(--textTertiary); }

/* Kalıcı başlık (hesaplayıcı) */
.drug-head { display: flex; gap: 12px; align-items: flex-start; }
.drug-head .d-ico { width: 50px; height: 50px; border-radius: 15px; display: grid; place-items: center; color: #fff; font-size: 22px; flex: 0 0 auto;
  background: linear-gradient(135deg, var(--t), color-mix(in srgb, var(--t) 55%, transparent)); box-shadow: 0 5px 16px color-mix(in srgb, var(--t) 40%, transparent); }
.drug-head h1 { margin: 0; font-family: var(--font); font-size: 22px; font-weight: 900; line-height: 1.15; }
.drug-head p { margin: 3px 0 0; font-size: 12px; color: var(--textSecondary); }

/* Kan gazı adımları */
.steps-list { display: flex; flex-direction: column; gap: 8px; }
.gstep { display: flex; gap: 12px; padding: 12px; border-radius: var(--r-m); background: var(--fill-subtle); border-left: 3px solid var(--t); }
.gstep .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto; font-family: var(--font); font-weight: 900; font-size: 13px;
  background: color-mix(in srgb, var(--t) 16%, transparent); color: var(--t); }
.gstep .gt { min-width: 0; }
.gstep .gt small { display: block; font-family: var(--font); font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--textTertiary); }
.gstep .gt b { display: block; font-family: var(--font); font-size: 14px; font-weight: 800; color: var(--text); margin-top: 1px; }
.gstep .gt span { display: block; font-size: 11.5px; color: var(--textSecondary); margin-top: 2px; font-variant-numeric: tabular-nums; }

/* Bilgi panelleri ve kipler */
.band-row { display: flex; gap: 10px; align-items: flex-start; }
.band-row .rng { font-family: var(--font); font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 800; color: var(--t); min-width: 44px; padding: 3px 7px; border-radius: 7px; background: color-mix(in srgb, var(--t) 13%, transparent); text-align: center; flex: 0 0 auto; }
.band-row .bt b { display: block; font-family: var(--font); font-size: 12.5px; font-weight: 700; }
.band-row .bt span { display: block; font-size: 11.5px; color: var(--textSecondary); }
.band-row.cur .bt b { color: var(--t); }
.verdict { padding: 12px 14px; border-radius: var(--r-m); background: color-mix(in srgb, var(--t) 10%, transparent); border: 1px solid color-mix(in srgb, var(--t) 35%, transparent); }
.verdict b { display: block; font-family: var(--font); font-size: 15px; font-weight: 800; color: var(--t); }
.verdict p { margin: 4px 0 0; font-size: 12.5px; color: var(--textSecondary); }
.ref-text { font-size: 12px; color: var(--textSecondary); white-space: pre-line; }
.flow-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.flow-chips span { font-size: 11.5px; padding: 5px 9px; border-radius: 999px; background: color-mix(in srgb, var(--t) 12%, transparent); color: var(--t); font-family: var(--font); font-weight: 600; }
.kv { display: grid; grid-template-columns: minmax(90px, 34%) minmax(0, 1fr); gap: 4px 12px; font-size: 12.5px; }
.kv dt { color: var(--textTertiary); font-family: var(--font); font-weight: 700; }
.kv dd { margin: 0; color: var(--textSecondary); }

.modal-back { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center;
  padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); animation: fade .18s ease; }
@media (min-width: 640px) { .modal-back { align-items: center; } }
.modal { width: 100%; max-width: 520px; max-height: 86vh; overflow-y: auto; background: var(--surface-elev); color: var(--text); border-radius: var(--r-l);
  border: 1px solid var(--hairline); box-shadow: 0 30px 80px rgba(0,0,0,.45); padding: 20px; display: flex; flex-direction: column; gap: 14px; animation: rise .22s ease; }
.modal h3 { margin: 0; font-family: var(--font); font-size: 18px; font-weight: 800; }
.modal p { margin: 0; font-size: 13px; color: var(--textSecondary); }
.modal pre { margin: 0; padding: 12px; border-radius: var(--r-m); background: var(--code-bg); font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; color: var(--text); user-select: text; -webkit-user-select: text; }
.modal .m-actions { display: flex; gap: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; padding: 10px 16px; border-radius: 999px;
  background: var(--text); color: var(--bg); font-family: var(--font); font-size: 13px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.3); animation: rise .2s ease; max-width: calc(100% - 32px); text-align: center; }
body.has-sticky .toast { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

.disclaimer-wrap { padding-top: 40px; }
.disc-head { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.disc-head .d-ico { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font-size: 36px; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.disc-head h1 { margin: 0; font-family: var(--font); font-size: 27px; font-weight: 900; }
.disc-head p { margin: 0; font-size: 13px; color: var(--textSecondary); }
.disc-point { display: flex; gap: 12px; align-items: flex-start; }
.disc-point > .icon { color: var(--accent); font-size: 17px; margin-top: 2px; width: 26px; }
.disc-point b { display: block; font-family: var(--font); font-size: 14px; }
.disc-point span { font-size: 12px; color: var(--textSecondary); }

.lang-row { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: var(--r-m); background: var(--fill-subtle); border: 1px solid var(--hairline); cursor: pointer; width: 100%; text-align: left; }
.lang-row .flag { font-size: 22px; }
.lang-row b { flex: 1; font-family: var(--font); font-size: 14.5px; }
.lang-row.on { background: color-mix(in srgb, var(--accent) 12%, transparent); border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
.lang-row.on b, .lang-row.on .icon { color: var(--accent); }
.app-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.app-card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 6px; border-radius: var(--r-m); background: var(--fill-subtle); border: 1px solid var(--hairline); cursor: pointer;
  font-family: var(--font); font-size: 12px; font-weight: 700; color: var(--textSecondary); }
.app-card .icon { font-size: 20px; color: var(--textTertiary); }
.app-card.on { background: color-mix(in srgb, var(--tertiary) 14%, transparent); border-color: color-mix(in srgb, var(--tertiary) 60%, transparent); color: var(--text); }
.app-card.on .icon { color: var(--tertiary); }
.setting { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.setting b { display: block; font-family: var(--font); font-size: 13.5px; font-weight: 600; }
.setting span { display: block; font-size: 10.5px; color: var(--textTertiary); }
.loading { min-height: 60vh; display: grid; place-items: center; font-family: var(--font); color: var(--textTertiary); }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translate(var(--tx, 0), 14px); } to { opacity: 1; transform: translate(var(--tx, 0), 0); } }
.toast { --tx: -50%; }
