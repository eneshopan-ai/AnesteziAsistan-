# Geçici tanı işi: yayındaki sitenin yanıt verip vermediğini GitHub sunucusundan kontrol eder.
name: site-check
on:
  push:
    paths: ['.github/workflows/site-check.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Poll site
        run: |
          for i in $(seq 1 30); do
            for u in "https://eneshopan-ai.github.io/AnesteziAsistan-/" "https://eneshopan-ai.github.io/anesteziasistan-/" "https://eneshopan-ai.github.io/AnesteziAsistan-/js/core.js" "https://eneshopan-ai.github.io/AnesteziAsistan-/i18n/tr.json"; do
              code=$(curl -s -o /tmp/body -w '%{http_code}' -L "$u")
              echo "$(date -u +%H:%M:%S) $code $u $(grep -o '<title>[^<]*' /tmp/body | head -1)"
            done
            first=$(curl -s -o /dev/null -w '%{http_code}' "https://eneshopan-ai.github.io/AnesteziAsistan-/")
            if [ "$first" = "200" ] && [ "$i" -ge 2 ]; then echo "SITE OK"; exit 0; fi
            sleep 30
          done
          echo "SITE STILL NOT 200"; exit 1
